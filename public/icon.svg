<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Indigo to Primary Purple -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30245C" />
      <stop offset="50%" stop-color="#483387" />
      <stop offset="100%" stop-color="#7047EB" />
    </linearGradient>

    <!-- Glass Glow Accent -->
    <linearGradient id="glowGrad" x1="40" y1="20" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EEE8FF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Ribbon 1: Academic Cap / Vibrant Purple Gradient -->
    <linearGradient id="ribbon1" x1="45" y1="65" x2="195" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#EEE8FF" />
      <stop offset="100%" stop-color="#D8CCFF" />
    </linearGradient>

    <!-- Sparkle Gold/Lavender Accent -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEE8FF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowGlow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#19172A" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7047EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="240" height="240" rx="56" fill="url(#bgGrad)" />

  <!-- Subtle Top Highlight Rim -->
  <rect x="2" y="2" width="236" height="236" rx="54" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" />

  <!-- Inner Soft Glow Orb -->
  <circle cx="120" cy="90" r="70" fill="#7047EB" opacity="0.45" filter="blur(30px)" />

  <!-- Main Symbol Group with Shadow -->
  <g filter="url(#shadowGlow)">
    <!-- Stylized Modern "C" (Classio) with dynamic forward flow & mortarboard geometry -->
    <!-- Academic Diamond / Cap Top Crest -->
    <path 
      d="M120 48L176 74L120 100L64 74L120 48Z" 
      fill="url(#ribbon1)" 
    />
    
    <!-- Modern Flowing "C" Body -->
    <path 
      d="M168 118C162.5 106.5 151 98 134 98C110 98 94 116 94 138C94 160 110 178 134 178C152 178 164.5 168.5 170 155" 
      stroke="#FFFFFF" 
      stroke-width="19" 
      stroke-linecap="round" 
    />

    <!-- Accent Dot / Rising Star (Growth & Intelligence) -->
    <circle cx="178" cy="116" r="10" fill="#FFFFFF" />
    <circle cx="178" cy="116" r="6" fill="#7047EB" />
  </g>

  <!-- Star Sparkle 4-point top right -->
  <path 
    d="M188 56C188 62 184 66 184 66C184 66 188 70 188 76C188 70 192 66 192 66C192 66 188 62 188 56Z" 
    fill="url(#sparkleGrad)" 
  />
</svg>
